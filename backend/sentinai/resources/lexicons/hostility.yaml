# Hostility pattern lexicon for the heuristic classification backend and for evidence
# extraction / explainability in the transformer backend.
#
# Each pattern is a Python regex applied to the *normalized* text (lower-cased, de-obfuscated,
# emoji demojized, hashtags split).  The placeholder {G} is replaced at compile time with an
# alternation of every group term from targets.yaml (plus slurs), so a pattern such as
# "kill all {G}" matches "kill all <group>" for any known target.  Patterns without {G} are
# generic hostility cues that are still scored, but produce a *target* only if a group term
# is found nearby in the same post.
#
# weight: contribution to the category score (0-1).  Severity level per category:
#   stereotype=1, dehumanization=2, harassment=3, incitement=4.
#
# Languages: en, es, fr, pt, de, hi (romanized + Devanagari), ar (script + Arabizi).

stereotype:
  - { pattern: "\\b(all|every single|typical|those|these) {G}\\b", weight: 0.45 }
  - { pattern: "\\b{G} (are|r|is) (all|always|never|so|naturally|inherently|just|basically|genetically) \\w+", weight: 0.55 }
  - { pattern: "\\b{G} (are|r|is) (all )?(good|bad|great|terrible) at\\b", weight: 0.55 }
  - { pattern: "\\b(they|they're|theyre|they are|those people|these people|you people) ?(are|r|'re)? ?(all|always|never) (good|bad|great) at\\b", weight: 0.5 }
  - { pattern: "\\bthey'?re all (good|bad|great|terrible) at\\b", weight: 0.5 }
  - { pattern: "\\b(you people|your kind|your people|those people|these people)\\b", weight: 0.35 }
  - { pattern: "\\bwhat (do you|can you|else would you) expect from {G}\\b", weight: 0.6 }
  - { pattern: "\\bof course (it was|it's|its|they were) {G}\\b", weight: 0.55 }
  - { pattern: "\\b{G} (can'?t|cannot|can not) be trusted\\b", weight: 0.65 }
  - { pattern: "\\b{G} (are|is|r) (known|famous|notorious) for\\b", weight: 0.5 }
  - { pattern: "\\b{G} (are|r|is) (all )?(lazy|greedy|cheap|stingy|criminals?|thieves|violent|dirty|smelly|stupid|dumb|sneaky|liars|terrorists?|rapists?|backwards?|primitive|uncivili[sz]ed|savage|dishonest|untrustworthy)\\b", weight: 0.8 }
  - { pattern: "\\bthey('?re| are) all (lazy|greedy|cheap|criminals?|thieves|violent|dirty|smelly|stupid|dumb|sneaky|liars|terrorists?|rapists?|backwards?|primitive|uncivili[sz]ed|the same)\\b", weight: 0.7 }
  - { pattern: "\\b(not surprised|no surprise|unsurprising|as usual|as always)[^.]{0,30}{G}\\b", weight: 0.4 }
  - { pattern: "\\b{G} (always|never) \\w+", weight: 0.35 }
  - { pattern: "\\b(they|they're|theyre|these people|those people|you people|them|{G}) ?(are|r|'re|is)? ?(all|literally all|basically all|mostly|obviously|clearly) (terrorists?|criminals?|thieves|thiefs|rapists?|liars|frauds?|cheats?|scammers?|leeches|parasites|the same|like that|alike|crooks?|drug dealers?|gang ?members?|welfare (queens|cheats|leeches)|freeloaders?)\\b", weight: 0.8 }
  - { pattern: "\\b(every|each|every single) (one|last one) of (them|these|those|the) ?{G}? (is|are) (a |an )?(thief|criminal|terrorist|rapist|liar|fraud|cheat|scammer|leech|parasite|crook|drug dealer|gang member|freeloader|savage|animal)\\b", weight: 0.85 }
  - { pattern: "\\b{G} (control|controls|own|owns|run|runs) (everything|the (media|banks|world|government|economy|country|news|hollywood|money))\\b", weight: 0.85 }
  - { pattern: "\\b(don'?t|dont|do not|never|won'?t|wont|can'?t|cant|ion|i don'?t) trust (a single |any |none of |any of |them |those |these )?{G}\\b", weight: 0.7 }
  - { pattern: "\\b(ion|i don'?t|dont|never) trust none of (them|those|these|the) {G}\\b", weight: 0.7 }
  - { pattern: "\\b(taking over|took over|take over|are taking over|have taken over) (the |our |this |my )?(whole |entire )?(town|city|country|neighbou?rhood|street|streets|schools?|place|area|block|nation|west|europe|america|britain)\\b", weight: 0.6 }
  # es
  - { pattern: "\\b(todos los|todas las|típic[oa]s?) {G}\\b", weight: 0.45 }
  - { pattern: "\\b{G} son (todos |todas )?(vagos|ladrones|sucios|delincuentes|criminales|violentos|tontos|mentirosos|terroristas)\\b", weight: 0.8 }
  # fr
  - { pattern: "\\b(tous les|toutes les|typique) {G}\\b", weight: 0.45 }
  - { pattern: "\\b{G} sont (tous |toutes )?(paresseux|voleurs|sales|criminels|violents|bêtes|menteurs|terroristes)\\b", weight: 0.8 }
  # pt
  - { pattern: "\\b(todos os|todas as|típic[oa]s?) {G}\\b", weight: 0.45 }
  - { pattern: "\\b{G} são (todos |todas )?(preguiçosos|ladrões|sujos|bandidos|criminosos|violentos|burros|mentirosos|terroristas)\\b", weight: 0.8 }
  # de
  - { pattern: "\\b(alle|typische?) {G}\\b", weight: 0.45 }
  - { pattern: "\\b{G} sind (alle )?(faul|diebe|dreckig|kriminell|kriminelle|gewalttätig|dumm|lügner|terroristen)\\b", weight: 0.8 }
  # hi (romanized + script)
  - { pattern: "\\b(saare|sare|sab|sabhi|ye sab|yeh sab) {G}\\b", weight: 0.45 }
  - { pattern: "\\b{G} (sab|saare|sare)? ?(chor|gande|ganda|jhoothe|jhoote|kamine|aatankwadi|atankwadi|gaddar|deshdrohi) (hain|hai|hote hain)\\b", weight: 0.8 }
  - { pattern: "(सारे|सब|सभी|ये सब) {G}", weight: 0.45 }
  - { pattern: "{G} (सब |सारे )?(चोर|गंदे|झूठे|कमीने|आतंकवादी|गद्दार|देशद्रोही) (हैं|होते हैं)", weight: 0.8 }
  # ar
  - { pattern: "(كل|جميع) {G}", weight: 0.45 }
  - { pattern: "{G} (كلهم |كلها )?(كذابين|حرامية|أوسخ|وسخين|إرهابيين|ارهابيين|متخلفين|همج)", weight: 0.8 }
  - { pattern: "\\b(kol|kul|kull) {G}\\b", weight: 0.45 }

dehumanization:
  # exclusion
  - { pattern: "\\b(don'?t|do not|doesn'?t|does not) belong (here|in (this|our|my) country)\\b", weight: 0.75 }
  - { pattern: "\\bgo back to (where|your|the|africa|asia|mexico|china|india|pakistan|syria|the middle east)\\b", weight: 0.8 }
  - { pattern: "\\bget (out|the hell out) of (our|my|this) country\\b", weight: 0.8 }
  - { pattern: "\\b(are|r|is) not welcome (here|in)\\b", weight: 0.65 }
  - { pattern: "\\b(send|ship|kick) (them|em|'em|{G}) (all )?(back|out|home)\\b", weight: 0.8 }
  - { pattern: "\\bdeport (them|em|'em|all of them|every (one|single one)|the {G}|{G}) ?(all)?\\b", weight: 0.75 }
  - { pattern: "\\bmass deportations?\\b", weight: 0.45 }
  - { pattern: "\\b(ban|bar|block) (all )?{G}\\b", weight: 0.6 }
  - { pattern: "\\bno more {G}\\b", weight: 0.55 }
  - { pattern: "\\b(taking|take|steal|stealing|took) our (jobs|country|women|homes|benefits)\\b", weight: 0.6 }
  - { pattern: "\\b(replace|replacing|replaced) us\\b", weight: 0.6 }
  - { pattern: "\\bgreat replacement\\b", weight: 0.75 }
  - { pattern: "\\bwhite genocide\\b", weight: 0.75 }
  - { pattern: "\\b(invasion|invaders|invading|infestation|infest(ed|ing)?|swarm(ing|s)?|flood(ing)? (our|the) (country|border|streets|cities)|horde|hordes)\\b", weight: 0.7 }
  - { pattern: "\\b(breed|breeding|multiply) like (rats|rabbits|roaches|cockroaches|animals)\\b", weight: 0.85 }
  # dehumanizing metaphors
  - { pattern: "\\b(vermin|cockroach(es)?|roaches|parasites?|leeches|rats|animals|beasts|savages?|subhumans?|sub-humans?|untermensch(en)?|mongrels?|apes?|monkeys?|dogs|pigs|swine|filth|scum of the earth|plague|disease|cancer|virus|garbage|trash of|degenerates?|barbarians?)\\b", weight: 0.65 }
  - { pattern: "\\b(are|r|is|like) (nothing but |just |literally |basically )?(animals|vermin|cockroaches|roaches|parasites|rats|subhuman|sub-human|savages|beasts|a (plague|disease|cancer|virus))\\b", weight: 0.9 }
  - { pattern: "\\b(not|aren'?t|ain'?t|are not) (even )?(human|people)\\b", weight: 0.85 }
  - { pattern: "\\b(less than|lower than) human\\b", weight: 0.85 }
  - { pattern: "\\binferior (race|people|culture|religion)\\b", weight: 0.85 }
  - { pattern: "\\b(should|shouldn'?t|must|need to) be (allowed|banned|segregated|separated|sterili[sz]ed|removed|purged|kept out)\\b", weight: 0.7 }
  - { pattern: "\\bkeep (them|{G}) out\\b", weight: 0.6 }
  - { pattern: "\\b(ruin(ed|ing)?|destroy(ed|ing)?) (our|this) (country|city|neighbou?rhood|culture|nation)\\b", weight: 0.55 }
  - { pattern: "\\b(don'?t|do not) (deserve|have) (any )?rights\\b", weight: 0.75 }
  - { pattern: "\\b(run|drive|chase|push|force|throw|kick|get|clear|flush|smoke) (them|em|'em|{G}|(every|each) (one|last one|single one) of (them|these|those|the) ?{G}?|all (of )?(them|these|those|the) ?{G}?) (all )?(out|off|away|out of|off of|outta) (the |our |this |my )?(neighbou?rhood|town|city|country|state|streets?|block|area|schools?|here|britain|america|europe|germany|france|spain|india|our land|our streets)\\b", weight: 0.8 }
  - { pattern: "\\b(get|throw|kick|keep|drive|run|force|chase|push) (them|em|'em|{G}) (all )?(out|off|away|out of here|outta here|out of (our|this|my) (country|town|city|neighbou?rhood|land|schools?))\\b", weight: 0.75 }
  - { pattern: "\\b(need|needs|have|has|ought|got|gotta|must|should) (to )?be (dealt with|taken care of|handled|removed|gotten rid of|cleared out|cleaned out|wiped out|put in their place|taught a lesson|stopped|shipped out|shipped back|sent back|thrown out|kicked out|rounded up|locked up|put down|exterminated|eliminated)( once and for all| for good| permanently)?\\b", weight: 0.75 }
  - { pattern: "\\b(get rid of|be rid of|rid (us|ourselves|the country|this country|our country) of|purge|cleanse|remove|eliminate|expel|evict|banish|exile) (all |every |the |these |those |them |every single |all of |all the )?(of )?(the )?{G}\\b", weight: 0.8 }
  - { pattern: "\\b(zero|no) {G} (should be |should ever be |allowed |permitted )?(in|allowed in|permitted in|welcome in|inside|near|around) (our|this|my|the) (country|town|city|schools?|neighbou?rhood|borders?|state|nation)\\b", weight: 0.75 }
  - { pattern: "\\b(not|never) (one|a single|another) (more )?{G} (in|inside|near|allowed in|should be in) (our|this|my|the) (country|town|city|schools?|neighbou?rhood|borders?|state|nation)\\b", weight: 0.75 }
  # es
