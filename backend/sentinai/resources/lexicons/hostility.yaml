  - { pattern: "\\b(invasión|invasores|invaden|infestan)\\b", weight: 0.65 }
  - { pattern: "\\bdeport(en|ar|arlos|arlas)( a)? (todos|todas)?\\b", weight: 0.75 }
  # fr
