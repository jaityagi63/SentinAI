# Slur lexicon — Task C level 3 ("Slurs / Targeted Harassment") and Task B evidence.
#
# CONTENT WARNING: this file contains real ethnic, religious and nationality slurs.  It exists
# solely so the detector can recognise them; it is loaded by sentinai.classification.lexicon
# and never rendered in the UI except as the flagged span of a post under review.
#
# Format:  <term>: { category: ethnicity|religion|nationality, label: <target label>,
#                    weight: 0-1 (harassment contribution), ambiguous: bool (optional) }
#
# `ambiguous: true` marks terms with a common benign sense (e.g. a word that is also an
# ordinary noun).  Ambiguous terms only score when hostile context is present in the same post.
#
# In production this file is intended to be replaced / augmented by a licensed lexicon
# (e.g. Hatebase, The Weaponized Word) via `LexiconLoader.extend()`.  Matching is on the
# de-obfuscated, lower-cased text so leetspeak / homoglyph / spaced-out variants also match.

