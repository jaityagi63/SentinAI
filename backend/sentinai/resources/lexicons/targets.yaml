# Target demographic lexicon (Task B — heuristic backend & evidence extraction).
#
# Every entry maps a *neutral group name* (and multilingual / romanized variants) to a
# (category, label) pair.  These are ordinary demographic terms, not slurs — a mention of a
# group is only reported as a *target* when it co-occurs with hostile content.
#
# Languages covered: en, es, fr, pt, de, hi (Devanagari + romanized), ar (script + Arabizi).
# Multi-word phrases are allowed; matching is case-insensitive on the normalized text.

