# SentinAI — single-command deployment.
#   docker compose up --build            → API + dashboard on http://localhost:8000 (SQLite, demo data)
#   docker compose --profile db up       → additionally PostgreSQL (metadata) + MongoDB (raw payloads)
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SENTINAI_SEED_DEMO_DATA: ${SENTINAI_SEED_DEMO_DATA:-true}
      # Uncomment (or set in .env) to use the optional databases below:
      # SENTINAI_DATABASE_URL: postgresql+psycopg://sentinai:sentinai@postgres:5432/sentinai
      # SENTINAI_RAW_STORE_URL: mongodb://mongo:27017
    volumes:
      - sentinai-data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: sentinai
      POSTGRES_PASSWORD: sentinai
      POSTGRES_DB: sentinai
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinai"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    profiles: ["db"]
    volumes:
      - mongo-data:/data/db

volumes:
  sentinai-data:
  pg-data:
  mongo-data:
